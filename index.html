    this.range = null; this.changed(); PV.render();
    toast('The paragraph was removed from this page.', { title: 'Paragraph deleted', action: { label: 'Undo', fn: () => this.undo() } });
  },
  async saveTpl() {
    this.flush(true);
    const tpl = this.tpl(), d = this.d;
    if (!d.edits || !Object.keys(d.edits).length) { toast('Edit the wording or layout on the page first, then save it as the template.', { type: 'info', title: 'Nothing to save yet' }); return; }
    const ok = await confirmDialog({ title: 'Save as the template?', body: `New documents created from “${esc(tpl.title)}” will start with this document’s wording, paragraphs and formatting. Tinted values from the form (client, dates, amounts) stay as fields and fill in for each new document. Documents already created are not changed.`, confirm: 'Save as template' });
    if (!ok) return;

    toast('New documents from this template will use this version. Restore the original any time from Templates.', { title: 'Template saved', action: { label: 'Open template', fn: () => go('#/tpl/' + encodeURIComponent(tpl.id)) } });
  },
  changeCase(mode) {
    const h = this.restoreRange(); if (!h) return;
    const r = getSelection().getRangeAt(0);
    if (r.collapsed) { toast('Select the words whose case you want to change.', { type: 'info', title: 'Nothing selected' }); return; }
    const nodes = [], tw = document.createTreeWalker(h, NodeFilter.SHOW_TEXT); let n;
    while ((n = tw.nextNode())) if (r.intersectsNode(n) && !n.parentElement.closest('.ph, .fv')) nodes.push(n);
    let prev = ' ', cap = true;
    nodes.forEach(t => {
      const a = t === r.startContainer ? r.startOffset : 0, z = t === r.endContainer ? r.endOffset : t.length;
      let out = '';
      for (const ch of t.data.slice(a, z)) {
        const letter = /\p{L}/u.test(ch);
        let c = ch;
        if (mode === 'upper') c = ch.toUpperCase();
        else if (mode === 'lower') c = ch.toLowerCase();
        else if (mode === 'title') c = letter && !/[\p{L}\p{N}'’]/u.test(prev) ? ch.toUpperCase() : ch.toLowerCase();
        else if (mode === 'sentence') { c = letter && cap ? ch.toUpperCase() : ch.toLowerCase(); if (letter) cap = false; if (/[.!?]/.test(ch)) cap = true; }
        out += c.length === ch.length ? c : ch;

      t.data = t.data.slice(0, a) + out + t.data.slice(z);

  },
  action(a, btn) {

    switch (a) {
      case 'para': {

        const base = this.onChange ? null : baseEdits(this.tpl());
        this.pending.clear();
        if (base) this.d.edits = base; else delete this.d.edits;
        this.changed(); PV.render();

        return;
      }
      case 'find': return this.openFind();
      case 'fclose': { const f = $('.pv-find', PV.host); if (f) f.hidden = true; return; }
      case 'fnext': return this.fnext(1);
      case 'fprev': return this.fnext(-1);
      case 'frep': return this.freplace();
      case 'fall': return this.freplaceAll();
    }
  },
  /* ---- Find & Replace ---- */
  openFind() {
    const f = $('.pv-find', PV.host); if (!f) return;
    f.hidden = false;
    const q = $('[data-pvf="q"]', f), s = getSelection();
    if (s.rangeCount && this.hostOf(s.anchorNode) && !s.isCollapsed && s.toString().length < 80) q.value = s.toString();
    q.focus(); q.select(); this.fi = -1; this.fcount();
  },
  fq() { const f = $('.pv-find', PV.host); return { q: $('[data-pvf="q"]', f).value, r: $('[data-pvf="r"]', f).value, mc: $('[data-pvf="case"]', f).checked }; },
  matches() {
    const { q, mc } = this.fq(), w = this.wrap();
    if (!q || !w) return [];
    const seen = new Set(), out = [];
    $$('[contenteditable="true"][data-bi]', w).forEach(el => {
      const bi = el.dataset.bi; if (seen.has(bi)) return; seen.add(bi);
      let text = this.parts(bi).map(p => p.textContent).join('');
      let needle = q;
      if (!mc) { text = text.toLowerCase(); needle = q.toLowerCase(); }
      for (let i = text.indexOf(needle); i >= 0; i = text.indexOf(needle, i + needle.length)) out.push({ bi, a: i, f: i + needle.length });
    });
    return out;
  },
  fcount(i) {
    const n = this.matches().length, el = $('#pve-fc');
    if (el) el.textContent = !this.fq().q ? '' : n ? (i >= 0 ? `${i + 1} of ${n}` : `${n} match${n > 1 ? 'es' : ''}`) : 'No matches';
    return n;
  },
  fnext(dir) {
    this.flush();
    const list = this.matches();
    if (!list.length) { this.fcount(); return; }
    this.fi = ((this.fi < 0 && dir < 0 ? 0 : this.fi) + dir + list.length) % list.length;
    this.fcur = list[this.fi];
    this.restoreSel(this.fcur, true, true); /* highlight the match; typing stays in the Find box */

  },
  freplace() {
    const { q, r, mc } = this.fq(), m = this.fcur;
    const list = this.matches();

    const parts = this.parts(m.bi), [an, ao] = this.pos(parts, m.a), [fn, fo] = this.pos(parts, m.f);
    const rg = document.createRange(); rg.setStart(an, ao); rg.setEnd(fn, fo);
    rg.deleteContents(); rg.insertNode(document.createTextNode(r));
    this.pending.add(m.bi); this.flush();
    this.fi = Math.max(-1, this.fi - 1); this.fcur = null;

  freplaceAll() {

    bis.forEach(bi => {
      const parts = this.parts(bi);
      list.filter(m => m.bi === bi).sort((x, y) => y.a - x.a).forEach(m => {
        const [an, ao] = this.pos(parts, m.a), [fn, fo] = this.pos(parts, m.f);

        rg.deleteContents(); rg.insertNode(document.createTextNode(r));
      });
      this.pending.add(bi);
    });
    this.flush();
    this.fi = -1; this.fcount();
    toast(`${list.length} replaced.`, { title: 'Replace all', action: { label: 'Undo', fn: () => this.undo() } });
  }
};

function readLogo(file) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('Please choose an image file (PNG, JPG, SVG or WebP).'));
    if (file.size > 4 * 1024 * 1024) return rej(new Error('That image is larger than 4 MB. Please use a smaller file.'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('The file could not be read.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('The image could not be decoded.'));
      im.onload = () => {
        /* kept sharp enough for 1200 dpi: the logo prints at most 130 × 62 px (34 × 16 mm), i.e. about
           1650 × 800 dots at 1200 dpi. Raster images are never enlarged; SVG logos are drawn at full size. */
        const svg = /svg/i.test(file.type);
        const w0 = im.naturalWidth || 480, h0 = im.naturalHeight || 240;
        const s = Math.min(svg ? Infinity : 1, 1650 / w0, 800 / h0);
        const cv = document.createElement('canvas'); cv.width = Math.round(w0 * s) || 1; cv.height = Math.round(h0 * s) || 1;
        const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(im, 0, 0, cv.width, cv.height);
        let url = cv.toDataURL('image/png');
        if (url.length > 1.6e6) { /* a photographic logo: high-quality JPEG on white keeps the browser storage small */
          const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height;
          const g2 = c2.getContext('2d'); g2.fillStyle = '#fff'; g2.fillRect(0, 0, c2.width, c2.height); g2.drawImage(cv, 0, 0);
          url = c2.toDataURL('image/jpeg', 0.95);
        }
        res(url);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); persistSoon.flush(); if (persist()) toast('All changes are saved in this browser.', { title: 'Saved', timeout: 2000 }); return; }
  const inEditor = location.hash.startsWith('#/doc/') && ED.draft;
  if (mod && e.key.toLowerCase() === 'p' && inEditor && !OV.length && !EMBEDDED) { e.preventDefault(); edExport('print', $('[data-kind="print"]')); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'e' && inEditor && !OV.length) { e.preventDefault(); edExport('pdf', $('[data-kind="pdf"]')); return; }
  if (typing || mod || e.altKey || OV.length) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openPicker(); }
  else if (e.key === '/') { const s = $('#lib-q,#doc-q,#cl-q'); e.preventDefault(); s ? s.focus() : openPalette(); }
  else if (e.key === '?') { e.preventDefault(); showShortcuts(); }
});

function applyCollapse() {
  const c = !!state.ui.collapsed;
  $('#app').dataset.collapsed = String(c);
  const b = $('.collapse-btn'); b.setAttribute('aria-label', c ? 'Expand sidebar' : 'Collapse sidebar'); $('.lbl', b).textContent = c ? 'Expand' : 'Collapse';
}
function updateChrome() {
  const f = state.firm;
  $('#firm-chip').innerHTML = `<span class="firm-av">${has(f.logo) ? `<img src="${esc(f.logo)}" alt="">` : esc(initials(f.name, 2) || 'CA')}</span><span class="firm-meta"><b>${esc(f.name || 'Set up your firm')}</b><small>${has(f.frn) ? 'FRN ' + esc(f.frn) : 'Add FRN & letterhead'}</small></span>`;
  $('#firm-chip').dataset.navtip = f.name || 'Firm profile';
  $('#nd-firm').hidden = firmReady();
  $('#nc-docs').textContent = state.drafts.length || '';
  $('#nc-clients').textContent = state.clients.length || '';
}
function defaultTopbar(v) {
  return `<button class="icon-btn only-mobile" data-act="open-nav" aria-label="Open navigation">${ic('menu')}</button>
    <div class="tb-title"><div class="tb-eyebrow">${esc(v.eyebrow || '')}</div><h1>${esc(v.title)}</h1></div>
    <div class="tb-spacer"></div>
    <button class="search-trigger" data-act="palette" aria-label="Search and commands (${MOD}+K)">${ic('search', 'sm')}<span>Search or jump to…</span><kbd>${MOD} K</kbd></button>
    <button class="btn btn-primary tb-new" data-act="new-doc">${ic('plus')}<span class="bl">New document</span></button>`;
}
const ROUTES = [
  [/^#?\/?$/, () => viewDashboard()],
  [/^#\/documents$/, () => viewDocuments()],
  [/^#\/templates$/, () => viewLibrary()],
  [/^#\/doc\/([\w-]+)$/, m => viewEditor(m[1])],
  [/^#\/compose$/, () => viewComposeList()],
  [/^#\/compose\/([\w-]+)$/, m => viewComposer(m[1])],
  [/^#\/tpl\/(.+)$/, m => viewTplEdit(decodeURIComponent(m[1]))],
  [/^#\/clients$/, () => viewClients()],
  [/^#\/firm$/, () => viewFirm()]
];
function route() {
  persistSoon.flush();
  closeMenu(); hideTip();
  while (OV.length) OV[OV.length - 1].close();
  PV.detach(); ED.draft = null;
  const h = location.hash || '#/';
  let v = null;
  for (const [re, fn] of ROUTES) { const m = h.match(re); if (m) { v = fn(m); break; } }
  if (!v) v = viewMissing('Page not found', 'That address does not exist in Sriram’s Template factory.');
  const tb = $('#topbar');
  tb.innerHTML = v.topbar || defaultTopbar(v);
  tb.classList.toggle('ruled', !!v.ruled);
  const view = $('#view');
  view.className = 'view' + (v.full ? ' full' : '');
  view.innerHTML = `<div class="vroot">${v.html}</div>`;
  $$('#nav a').forEach(a => { if (a.dataset.route === v.nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.title = `${v.title} · Sriram’s Template factory`;
  $('#app').classList.remove('nav-open');
  window.scrollTo(0, 0);
  if (v.mount) v.mount($('.vroot', view));
  updateChrome();
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', scrollY > 4), { passive: true });
window.addEventListener('beforeunload', () => persistSoon.flush());
document.addEventListener('visibilitychange', () => { if (document.hidden) persistSoon.flush(); });
setInterval(() => { const el = $('#save-state'); if (el && el.textContent.startsWith('Saved')) { const d = ED.draft; if (d) el.textContent = 'Saved ' + relTime(d.updatedAt); } }, 30000);

/* boot */
applyCollapse();
route();
if (!storageOK) toast('Changes will not persist after you close this tab.', { type: 'error', title: 'Browser storage unavailable', timeout: 8000 });
else if (!state.ui.storageAck) setTimeout(() => showStorageInfo(true), 400);
if (document.fonts) {
  Promise.all(['400 15px Tinos', '700 15px Tinos', 'italic 400 15px Tinos'].map(f => document.fonts.load(f).catch(() => {}))).then(() => fontsReady()).then(() => { if (PV.host) PV.render(); });
}
</script>
</body>
</html>
