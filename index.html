<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>CA AuditDesk</title>
<meta name="description" content="Audit-document workspace for Chartered Accountants in India — letterhead-perfect NOCs, consents, engagement and representation letters.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E1A2B'/%3E%3Cpath d='M10 23 16 8l6 15M12.4 17.5h7.2' stroke='%23D4B26A' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root{
  --ink-950:#09111E; --ink-900:#0E1A2B; --ink-800:#15243A; --ink-700:#22334D; --ink-600:#3A4A63;
  --bg:#F7F4EE; --surface:#FFFDF9; --surface-2:#FBF8F2;
  --ivory-50:#FCFAF6; --ivory-200:#F1ECE2; --ivory-300:#E7E0D2;
  --line:#E7E0D3; --line-soft:#EFEAE0; --line-strong:#D8CEBB;
  --text:#131C2B; --text-2:#4A5467; --text-3:#7C8596;
  --emerald:#0E7A5A; --emerald-600:#0A6449; --emerald-50:#E6F2EC; --emerald-300:#5FD3A6;
  --gold:#B08A45; --gold-600:#8E6D31; --gold-300:#D4B26A; --gold-50:#F8F1E2;
  --danger:#B42318; --danger-50:#FCECEA;
  --shadow-1:0 1px 2px rgba(14,26,43,.05),0 1px 1px rgba(14,26,43,.03);
  --shadow-2:0 6px 18px -8px rgba(14,26,43,.14),0 2px 4px rgba(14,26,43,.04);
  --shadow-3:0 28px 56px -16px rgba(14,26,43,.28),0 6px 14px rgba(14,26,43,.07);
  --font-ui:"Geist","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --font-doc:"Tinos","Times New Roman",Times,"Liberation Serif",serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --topbar:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 var(--font-ui);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:6px}
.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:15px;height:15px}.i.lg{width:22px;height:22px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:500 11px/1 var(--font-ui);padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--text-3);box-shadow:0 1px 0 var(--line)}

/* =====================================================================
   BUTTONS
   ===================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;font-weight:550;font-size:13.5px;border:1px solid transparent;transition:background .15s,border-color .15s,box-shadow .15s,transform .08s,color .15s;white-space:nowrap;user-select:none;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--emerald);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(6,60,44,.3)}
.btn-primary:hover{background:var(--emerald-600)}
.btn-dark{background:var(--ink-900);color:#F5F1E8}
.btn-dark:hover{background:var(--ink-700)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--line-strong);background:#fff}
.btn-quiet{color:var(--text-2)}
.btn-quiet:hover{background:rgba(14,26,43,.05);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#951c13}
.btn-gold{background:linear-gradient(180deg,#DDBE7C,#C29C57);color:#20180A;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px -8px rgba(176,138,69,.7)}
.btn-gold:hover{filter:brightness(1.04)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.lg{height:46px;padding:0 22px;font-size:15px;border-radius:12px}
.btn[disabled],.btn.busy{opacity:.6;pointer-events:none}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:9px;color:var(--text-2);transition:background .15s,color .15s;flex:none}
.icon-btn:hover{background:rgba(14,26,43,.06);color:var(--text)}
.icon-btn.danger:hover{background:var(--danger-50);color:var(--danger)}
.only-mobile{display:none!important}

/* =====================================================================
   APP SHELL
   ===================================================================== */
.app{display:grid;grid-template-columns:var(--side-w,260px) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .28s var(--ease)}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:16px 12px 12px;background:var(--ink-900);color:#AEB8C8;z-index:40;background-image:radial-gradient(130% 55% at 0% 0%,rgba(212,178,106,.09),transparent 60%)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;text-decoration:none;color:#F6F1E7;min-height:52px}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{display:block;font-family:var(--font-display);font-size:24px;line-height:1}
.brand-sub{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#7E8AA0;margin-top:4px;white-space:nowrap}
.side-new{display:flex;align-items:center;gap:10px;height:42px;margin:0 2px 10px;padding:0 12px;border-radius:11px;font-weight:600}
.side-new kbd{margin-left:auto;background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.14);color:#3a2d10;box-shadow:none}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-grp{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#627089;padding:14px 12px 6px;white-space:nowrap}
.nav a{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:#B7C1D1;text-decoration:none;font-weight:500;transition:background .15s,color .15s;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.05);color:#F3EEE3}
.nav a[aria-current="page"]{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--gold-300)}
.nav-count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.08);padding:1px 8px;border-radius:99px;color:#C8D0DC}
.nav-count:empty{display:none}
.nav-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#E0A84A;box-shadow:0 0 0 3px rgba(224,168,74,.2)}
.side-foot{border-top:1px solid rgba(255,255,255,.07);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.firm-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;text-decoration:none;color:#E9E3D6;transition:background .15s}
.firm-chip:hover{background:rgba(255,255,255,.05)}
.firm-av{width:34px;height:34px;border-radius:9px;background:#F5F0E6;display:grid;place-items:center;overflow:hidden;color:var(--ink-900);font-weight:700;font-size:12px;flex:none;letter-spacing:.02em}
.firm-av img{max-width:88%;max-height:88%;object-fit:contain}
.firm-meta{min-width:0;line-height:1.3}
.firm-meta b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.firm-meta small{color:#7E8AA0;font-size:11.5px}
.side-credit{display:flex;flex-direction:column;gap:1px;padding:6px 10px 4px;font-size:10.5px;line-height:1.45;color:#7E8AA0;white-space:nowrap}
.side-credit span:first-child{color:#B7C1D1}
.side-mail{color:var(--gold-300);user-select:all;margin-top:2px}
.made-by{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:40px;padding-top:18px;border-top:1px solid var(--ivory-300);font-size:12.5px;color:var(--ink-600);text-align:center}
.made-by b{font-weight:600;color:var(--ink-900)}
.made-mail{font-size:12px;color:var(--ink-600);user-select:all;letter-spacing:.01em}
.made-copy{font-size:11px;color:var(--ink-600);opacity:.8;margin-top:4px}
[data-embedded] [data-kind="print"],[data-embedded] .kbd-print{display:none!important}
.collapse-btn{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:9px;color:#7E8AA0;font-size:13px;white-space:nowrap}
.collapse-btn:hover{background:rgba(255,255,255,.05);color:#E9E3D6}
@media (min-width:901px){
  .app[data-collapsed="true"]{--side-w:76px}
  .app[data-collapsed="true"] .lbl,.app[data-collapsed="true"] .brand-txt,.app[data-collapsed="true"] .firm-meta,.app[data-collapsed="true"] .nav-count,.app[data-collapsed="true"] .side-new kbd{display:none}
  .app[data-collapsed="true"] .nav-grp{font-size:0;padding:0;height:1px;margin:12px 14px;background:rgba(255,255,255,.08)}
  .app[data-collapsed="true"] .nav a,.app[data-collapsed="true"] .side-new,.app[data-collapsed="true"] .collapse-btn{justify-content:center;padding:0}
  .app[data-collapsed="true"] .brand{justify-content:center;padding-left:0;padding-right:0}
  .app[data-collapsed="true"] .firm-chip{justify-content:center}
  .app[data-collapsed="true"] .nav-dot{position:absolute;top:9px;right:14px}
  .app[data-collapsed="true"] .collapse-btn .i{transform:rotate(180deg)}
}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:var(--topbar);padding:0 28px;background:rgba(247,244,238,.84);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled,.topbar.ruled{border-bottom-color:var(--line)}
.tb-title{min-width:0}
.tb-title h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-eyebrow{font-size:11.5px;color:var(--text-3)}
.tb-spacer{flex:1}
.search-trigger{display:flex;align-items:center;gap:10px;height:38px;width:min(320px,30vw);padding:0 8px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text-3);font-size:13.5px;transition:border-color .15s,box-shadow .15s}
.search-trigger:hover{border-color:var(--line-strong);box-shadow:var(--shadow-1)}
.search-trigger kbd{margin-left:auto}
.view{flex:1;min-width:0}
.vroot{max-width:1220px;margin:0 auto;padding:30px 32px 90px;animation:rise .38s var(--ease) both}
.view.full .vroot{max-width:none;padding:0;animation:fade .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* =====================================================================
   SHARED CONTENT PIECES
   ===================================================================== */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-family:var(--font-display);font-size:42px;font-weight:400;margin:0;letter-spacing:-.01em;line-height:1.02}
.page-sub{color:var(--text-2);margin:8px 0 0;font-size:15px;max-width:62ch}
.eyebrow{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-600);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 12px;gap:12px}
.sec-head h3{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.link{font-size:13px;color:var(--emerald);text-decoration:none;font-weight:550;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
.ticon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.tone-gold{background:var(--gold-50);color:var(--gold-600)}
.tone-emerald{background:var(--emerald-50);color:var(--emerald)}
.tone-ink{background:#E9EDF3;color:var(--ink-700)}
.tone-plum{background:#F2EBF3;color:#6B3F74}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:550;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-draft{background:#F1ECE2;color:#6B6152}
.pill-done{background:var(--emerald-50);color:var(--emerald)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 24px;border:1px dashed var(--line-strong);border-radius:18px;background:var(--surface-2)}
.empty .art{width:132px;height:auto;margin-bottom:8px}
.empty h4{font-family:var(--font-display);font-size:27px;font-weight:400;margin:4px 0 6px}
.empty p{color:var(--text-2);max-width:46ch;margin:0 0 18px}
.searchbox{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-1);transition:border-color .15s,box-shadow .15s;color:var(--text-3)}
.searchbox:focus-within{border-color:var(--emerald);box-shadow:0 0 0 4px rgba(14,122,90,.12)}
.searchbox input{border:0;outline:0;background:none;flex:1;font-size:15px;color:var(--text);min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--text-2);font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ink-900);border-color:var(--ink-900);color:#F5F0E6}
.chip small{font-size:11px;opacity:.65}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-1)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:14px;padding:12px 14px 12px 16px;border-top:1px solid var(--line-soft);transition:background .15s;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--ivory-50)}
.row-t b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-t small{display:block;color:var(--text-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-when{color:var(--text-3);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row-act{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.row:hover .row-act,.row:focus-within .row-act{opacity:1}
@media (hover:none){.row-act{opacity:1}}

/* =====================================================================
   DASHBOARD
   ===================================================================== */
.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.hero-main{position:relative;overflow:hidden;border-radius:22px;padding:34px 36px 32px;background:var(--ink-900);color:#EDE7DA;background-image:radial-gradient(90% 120% at 100% 0%,rgba(212,178,106,.17),transparent 55%),radial-gradient(60% 80% at 0% 110%,rgba(47,179,132,.13),transparent 60%)}
.hero-main::after{content:"";position:absolute;right:-40px;top:24px;width:300px;height:230px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.06) 0 1px,transparent 1px 26px);-webkit-mask:linear-gradient(90deg,transparent,#000 70%);mask:linear-gradient(90deg,transparent,#000 70%);pointer-events:none}
.hero-main .eyebrow{color:var(--gold-300)}
.display{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,4.2vw,50px);line-height:1.02;letter-spacing:-.012em;margin:12px 0 12px;color:#FBF7EE;position:relative}
.display em{color:#E3C88E}
.lede{color:#AFB9C9;max-width:48ch;margin:0 0 24px;font-size:15px;position:relative}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.hero-actions .btn-ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#EDE7DA}
.hero-actions .btn-ghost:hover{background:rgba(255,255,255,.1)}
.hero-card{padding:22px 22px 18px;display:flex;flex-direction:column}
.setup-top{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ring{width:62px;height:62px;flex:none}
.ring circle{fill:none;stroke-width:4.5}
.ring .bg{stroke:var(--ivory-300)}
.ring .fg{stroke:var(--emerald);stroke-linecap:round;transition:stroke-dasharray .8s var(--ease)}
.ring text{font:600 12px var(--font-ui);fill:var(--text)}
.setup-top h3{margin:0;font-size:16px;font-weight:600}
.setup-top p{margin:2px 0 0;color:var(--text-2);font-size:13px}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;flex:1}
.checklist a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;text-decoration:none;font-size:13.5px;color:var(--text-2)}
.checklist a:hover{background:var(--ivory-200);color:var(--text)}
.ck-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none}
.ck-dot .i{width:12px;height:12px;stroke-width:3;color:#fff}
.done .ck-dot{background:var(--emerald);border-color:var(--emerald)}
.checklist .done a{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.checklist .i.go{margin-left:auto;color:var(--text-3)}
.kbd-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.kbd-list div{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--text-2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:30px}
.stat{padding:16px 18px}
.stat-l{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:8px}
.stat-v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
.stat-c{font-size:12px;color:var(--text-3)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:32px}
.qt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:15px;background:var(--surface);border:1px solid var(--line);transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
.qt:hover{border-color:var(--line-strong);box-shadow:var(--shadow-2);transform:translateY(-2px)}
.qt b{font-size:13.5px;font-weight:600;display:block;line-height:1.3}
.qt small{color:var(--text-3);font-size:12px;display:block;margin-top:3px}

/* =====================================================================
   TEMPLATE LIBRARY
   ===================================================================== */
.lib-tools{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tcard{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);transition:transform .22s var(--ease),box-shadow .22s,border-color .22s}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-3);border-color:var(--line-strong)}
.tcard-top{display:flex;align-items:center;gap:12px}
.tcat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.tcard h3{font-size:17px;font-weight:600;letter-spacing:-.012em;margin:4px 0 0;line-height:1.3}
.tcard p{margin:0;color:var(--text-2);font-size:13.5px;flex:1}
.tmeta{display:flex;gap:6px 14px;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.tmeta span{display:inline-flex;gap:6px;align-items:center}
.tcard-act{display:flex;gap:8px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line-soft);align-items:center}
.tcard-act .btn-dark{margin-left:auto}
.tcard .tmenu{position:absolute;top:14px;right:12px}

/* =====================================================================
   FORMS
   ===================================================================== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;color:var(--text-2)}
.req{color:var(--gold)}
.hint{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;background:var(--ivory-200);color:var(--text-3);cursor:help}
.hint:hover{background:var(--ivory-300);color:var(--text)}
.in{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:#fff;font-size:14px;transition:border-color .15s,box-shadow .15s;outline:0}
textarea.in{height:auto;padding:10px 12px;resize:vertical;line-height:1.5;min-height:74px}
.in:hover{border-color:#C8BCA3}
.in:focus{border-color:var(--emerald);box-shadow:0 0 0 4px rgba(14,122,90,.12)}
.in::placeholder{color:#A9AFBA}
.fld.invalid .in,.fld.invalid .affix{border-color:var(--danger);box-shadow:0 0 0 3px rgba(180,35,24,.08)}
.ferr{font-size:12px;color:var(--danger);display:flex;gap:5px;align-items:center}
.ferr:empty{display:none}
.fhelp{font-size:12px;color:var(--text-3)}
.fhelp:empty{display:none}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer;text-overflow:ellipsis}
.sel .i{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-3)}
.affix{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
.affix>span{padding:0 4px 0 12px;color:var(--text-3);font-weight:550}
.affix .in{border:0;box-shadow:none!important;padding-left:6px;background:none}
.affix:focus-within{border-color:var(--emerald);box-shadow:0 0 0 4px rgba(14,122,90,.12)}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:var(--ivory-200)}
.seg button{flex:1 1 auto;min-height:32px;padding:4px 12px;border-radius:9px;font-size:13px;color:var(--text-2);font-weight:500;transition:background .15s,color .15s,box-shadow .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-checked="true"]{background:#fff;color:var(--text);box-shadow:var(--shadow-1);font-weight:600}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:var(--ivory-50);border:1px solid var(--line);cursor:pointer}
.swrow .fl{color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer}
.sw{width:40px;height:24px;border-radius:99px;background:#D3CAB8;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .22s var(--ease)}
.sw[aria-checked="true"]{background:var(--emerald)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.checks{display:flex;flex-direction:column;gap:6px}
.ck{position:relative;display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13.5px;line-height:1.4;transition:border-color .15s,background .15s}
.ck:hover{border-color:var(--line-strong)}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck-box{width:18px;height:18px;border-radius:5px;border:1.5px solid #BFB39A;display:grid;place-items:center;flex:none;margin-top:1px;transition:all .15s}
.ck-box .i{width:12px;height:12px;stroke-width:3;opacity:0;color:#fff}
.ck input:checked+.ck-box{background:var(--emerald);border-color:var(--emerald)}
.ck input:checked+.ck-box .i{opacity:1}
.ck:has(input:checked){border-color:#A6D3C1;background:#F6FBF8}
.ck input:focus-visible+.ck-box{outline:2px solid var(--emerald);outline-offset:2px}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--emerald)}
.range output{font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-2);min-width:48px;text-align:right}
.flash{animation:flash 1.3s var(--ease)}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(212,178,106,0)}25%{box-shadow:0 0 0 6px rgba(212,178,106,.4)}}

/* =====================================================================
   EDITOR
   ===================================================================== */
.ed{display:grid;grid-template-columns:minmax(380px,480px) minmax(0,1fr);height:calc(100vh - var(--topbar));height:calc(100dvh - var(--topbar))}
.ed-form{overflow-y:auto;border-right:1px solid var(--line);background:var(--bg)}
.ed-form-in{padding:22px 22px 120px}
.ed-intro{padding:2px 4px 18px}
.ed-intro h2{font-family:var(--font-display);font-weight:400;font-size:31px;line-height:1.08;margin:8px 0 10px;letter-spacing:-.01em}
.law{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--text-2);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:99px;line-height:1.35}
.progress{margin-top:18px}
.progress-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin-bottom:8px}
.progress-l b{font-weight:600;color:var(--text)}
.progress-bar{height:6px;border-radius:99px;background:var(--ivory-300);overflow:hidden}
.progress-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-300));border-radius:inherit;transition:width .45s var(--ease),background .3s}
.progress.ok .progress-bar i{background:var(--emerald)}
.fs{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;transition:box-shadow .2s,border-color .2s}
.fs.open{box-shadow:var(--shadow-2);border-color:var(--line-strong)}
.fs-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;border-radius:16px}
.fs-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;background:var(--ivory-200);color:var(--text-2);flex:none;transition:background .25s,color .25s}
.fs-num .i{width:14px;height:14px;stroke-width:2.6}
.fs.done .fs-num{background:var(--emerald);color:#fff}
.fs-titles{flex:1;min-width:0}
.fs-title{display:block;font-weight:600;font-size:14.5px}
.fs-sum{display:block;font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-count{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.fs-chev{transition:transform .22s var(--ease);color:var(--text-3)}
.fs.open .fs-chev{transform:rotate(180deg)}
.fs-body{padding:2px 16px 16px;animation:fade .2s ease}
.fs-next{display:flex;justify-content:flex-end;margin-top:14px}
.picker{display:flex;gap:8px;align-items:center;padding:10px;border-radius:12px;background:var(--ivory-50);border:1px dashed var(--line-strong);margin-bottom:14px;flex-wrap:wrap}
.picker .sel{flex:1;min-width:180px}
.picker .in{height:36px}
.ed-pv{position:relative;overflow:auto;background:#E6E0D4;background-image:radial-gradient(rgba(14,26,43,.075) 1px,transparent 1px);background-size:16px 16px}
.pv-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(230,224,212,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(14,26,43,.06)}
.pv-info{font-size:12.5px;color:var(--text-2);display:flex;gap:8px;align-items:center;white-space:nowrap}
.pv-info b{color:var(--text);font-weight:600}
.pv-legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.pv-legend i{width:18px;height:10px;border-radius:3px;background:#FBF1D9;box-shadow:inset 0 0 0 1px #EAD7A8}
.pv-zoom{margin-left:auto;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.pv-zoom button{height:30px;min-width:30px;padding:0 8px;border-radius:8px;font-size:12.5px;color:var(--text-2);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pv-zoom button:hover{background:var(--ivory-200);color:var(--text)}
.pv-zoom button[aria-pressed="true"]{background:var(--ivory-200);color:var(--text);font-weight:600}
.pv-pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:26px 24px 70px}
.pv-frame{position:relative;flex:none;box-shadow:0 1px 2px rgba(14,26,43,.08),0 14px 36px -10px rgba(14,26,43,.3);background:#fff;border-radius:2px}
.pv-frame::after{content:attr(data-n);position:absolute;right:0;bottom:-19px;font-size:11px;color:var(--text-3)}
.pv-scale{transform-origin:0 0;width:210mm;height:297mm}
.pv-skel{width:min(560px,90%);aspect-ratio:210/297;border-radius:2px;background:#fff;box-shadow:var(--shadow-2);padding:8%;display:flex;flex-direction:column;gap:14px}
.pv-skel i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,#F0EBE1 0%,#F8F5EF 40%,#F0EBE1 80%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.ed-tabs{display:none;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:35;padding:4px;border-radius:14px;background:var(--ink-900);box-shadow:var(--shadow-3);gap:4px}
.ed-tabs button{height:40px;padding:0 18px;border-radius:10px;color:#AEB8C8;font-weight:550;display:flex;gap:8px;align-items:center}
.ed-tabs button[aria-selected="true"]{background:#F5F0E6;color:var(--ink-900)}
/* editor top bar */
.ed-title{min-width:0;flex:1;max-width:520px}
.title-in{width:100%;border:0;background:none;font-size:15.5px;font-weight:600;letter-spacing:-.01em;padding:3px 6px;margin-left:-6px;border-radius:7px;outline:0;text-overflow:ellipsis}
.title-in:hover{background:rgba(14,26,43,.04)}
.title-in:focus{background:#fff;box-shadow:0 0 0 1px var(--line-strong)}
.title-in::placeholder{color:var(--text)}
.ed-sub{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);flex:none;transition:background .2s}
.save-dot.busy{background:var(--gold-300);animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.35}}
.status-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid;white-space:nowrap;transition:all .2s}
.status-chip.warn{background:var(--gold-50);border-color:#EAD9B3;color:var(--gold-600)}
.status-chip.ok{background:var(--emerald-50);border-color:#B8DCCB;color:var(--emerald)}
.btn-group{display:flex;gap:6px}

/* =====================================================================
   FIRM / CLIENTS / COMPOSER
   ===================================================================== */
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{padding:22px}
.panel-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.panel-h h3{margin:0;font-size:16px;font-weight:600}
.panel-h p{margin:2px 0 0;font-size:13px;color:var(--text-2)}
.sticky{position:sticky;top:calc(var(--topbar) + 16px)}
.drop{display:flex;align-items:center;gap:16px;padding:14px;border-radius:14px;border:1.5px dashed var(--line-strong);background:var(--ivory-50);transition:border-color .15s,background .15s;margin-bottom:16px}
.drop.over{border-color:var(--emerald);background:var(--emerald-50)}
.drop-img{width:86px;height:62px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--text-3)}
.drop-img img{max-width:90%;max-height:90%;object-fit:contain}
.drop-t{flex:1;min-width:0}
.drop-t b{display:block;font-size:13.5px}
.drop-t small{color:var(--text-3);font-size:12px}
.thumb{position:relative;width:100%;aspect-ratio:210/150;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#fff}
.thumb .pg{position:absolute;left:0;top:0;transform-origin:0 0}
.thumb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(transparent,#fff)}
.skl{height:9px;border-radius:5px;background:#EFEAE0;margin-bottom:12px}
.danger-zone{border-color:#F0D2CD}
.dz-row{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line-soft)}
.dz-row:first-of-type{border-top:0}
.dz-row b{display:block;font-size:13.5px;font-weight:600}
.dz-row small{color:var(--text-3);font-size:12.5px}
.ctable .row{grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr) auto auto}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--ivory-200);color:var(--ink-700);flex:none}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12.5px;color:var(--text-2)}
.cmp{display:grid;grid-template-columns:minmax(380px,520px) minmax(0,1fr);height:calc(100vh - var(--topbar));height:calc(100dvh - var(--topbar))}
.tb-tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line-strong);border-bottom:0;border-radius:10px 10px 0 0;background:var(--ivory-50)}
.tb-tools+.in,.fld-body .in{border-radius:0 0 10px 10px}
.tok{height:26px;padding:0 9px;border-radius:7px;font-size:12px;background:#fff;border:1px solid var(--line);color:var(--text-2);display:inline-flex;align-items:center;gap:5px;font-family:ui-monospace,Consolas,monospace}
.tok:hover{border-color:var(--gold);color:var(--gold-600)}
.tok.fmt{font-family:var(--font-ui);font-weight:600}
.tb-sep{width:1px;background:var(--line);margin:2px 2px}
.detected{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--text-2);margin-top:10px}
.detected code{background:var(--gold-50);color:var(--gold-600);padding:2px 7px;border-radius:6px;font-size:12px}

/* =====================================================================
   OVERLAYS
   ===================================================================== */
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px}
.ov-bg{position:absolute;inset:0;background:rgba(9,17,30,.46);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}
.ov.in .ov-bg{opacity:1}
.modal,.pal,.drawer{position:relative;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-3);opacity:0;transition:transform .24s var(--ease),opacity .2s}
.modal{width:min(520px,100%);max-height:calc(100dvh - 48px);display:flex;flex-direction:column;border-radius:20px;transform:translateY(10px) scale(.985)}
.ov.in .modal,.ov.in .pal,.ov.in .drawer{transform:none;opacity:1}
.modal.lg{width:min(880px,100%)}
.m-head{display:flex;align-items:center;gap:12px;padding:18px 20px 8px}
.m-head h2{font-size:17px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
.m-body{padding:4px 20px 20px;overflow:auto;color:var(--text-2)}
.m-body p{margin:0 0 10px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line-soft);background:var(--surface-2);border-radius:0 0 20px 20px;flex-wrap:wrap}
.issue-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.issue-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:10px;background:var(--ivory-50);border:1px solid var(--line);font-size:13.5px}
.issue-list button:hover{border-color:var(--gold)}
.issue-list small{margin-left:auto;color:var(--text-3);font-size:12px;white-space:nowrap}
.issue-list .i{color:var(--gold)}
.ov.top{align-items:start;padding-top:11vh}
.pal{width:min(640px,100%);border-radius:18px;overflow:hidden;transform:translateY(-8px) scale(.985)}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:58px;border-bottom:1px solid var(--line-soft);color:var(--text-3)}
.pal-in input{flex:1;border:0;outline:0;font-size:16px;background:none;color:var(--text)}
.pal-list{max-height:min(430px,58vh);overflow:auto;padding:6px}
.pal-g{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);padding:10px 10px 4px;font-weight:600}
.pal-it{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:10px;text-align:left;font-size:14px}
.pal-it .i{color:var(--text-3)}
.pal-it small{margin-left:auto;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.pal-it[aria-selected="true"]{background:var(--ivory-200)}
.pal-it[aria-selected="true"] .i{color:var(--emerald)}
.pal-empty{padding:28px;text-align:center;color:var(--text-3)}
.pal-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--text-3);background:var(--surface-2)}
.ov.side-ov{place-items:stretch end;padding:0}
.drawer{width:min(500px,100%);height:100%;display:flex;flex-direction:column;border-radius:0;border-width:0 0 0 1px;transform:translateX(28px)}
.drawer .m-body{flex:1;padding-top:10px}
.drawer .m-foot{border-radius:0}
.pk-list{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.pk-it{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:12px;text-align:left;border:1px solid transparent;transition:background .12s,border-color .12s}
.pk-it:hover,.pk-it[aria-selected="true"]{background:var(--ivory-50);border-color:var(--line)}
.pk-it b{display:block;font-weight:600;color:var(--text);font-size:14px}
.pk-it small{display:block;color:var(--text-3);font-size:12px}
.pk-it>.i{margin-left:auto;color:var(--text-3)}
.pk-g{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);padding:12px 10px 2px;font-weight:600}
.ql-pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0 10px;background:#E6E0D4;border-radius:12px;padding:18px}
.menu{position:fixed;z-index:120;min-width:210px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-3);animation:pop .14s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.menu [data-mi]{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;font-size:13.5px;text-align:left;color:var(--text)}
.menu [data-mi] .i{color:var(--text-3)}
.menu [data-mi]:hover,.menu [data-mi]:focus{background:var(--ivory-200);outline:0}
.menu .danger,.menu .danger .i{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line-soft);margin:5px 4px}
.menu .m-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding:6px 10px 4px;font-weight:600}
#tip{position:fixed;z-index:200;max-width:280px;padding:7px 10px;border-radius:8px;background:var(--ink-900);color:#F1ECE2;font-size:12px;line-height:1.4;pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;box-shadow:var(--shadow-2)}
#tip.show{opacity:1;transform:none}
.toasts{position:fixed;right:20px;bottom:20px;z-index:150;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:12px;min-width:290px;max-width:430px;padding:12px 10px 12px 12px;border-radius:14px;background:var(--ink-900);color:#EFEAE0;box-shadow:var(--shadow-3);animation:toastIn .32s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.toast.out{animation:toastOut .2s forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
.t-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.t-success .t-ic{background:rgba(47,179,132,.18);color:var(--emerald-300)}
.t-error .t-ic{background:rgba(240,90,70,.2);color:#FF9A8A}
.t-info .t-ic{background:rgba(212,178,106,.2);color:#E3C88E}
.t-msg{flex:1;font-size:13.5px;padding-top:4px;min-width:0}
.t-msg strong{display:block;font-weight:600;color:#fff}
.t-msg span{color:#B9C2D0;word-break:break-word}

#stage{position:fixed;left:-12000px;top:0;pointer-events:none}
#print-root{display:none}
.pg{width:210mm;height:297mm;background:#fff;color:#1B1D22;font-family:var(--font-doc);font-size:14.5px;line-height:1.55;padding:15mm 19mm 11mm;display:flex;flex-direction:column;overflow:hidden;position:relative;font-kerning:normal;text-align:left}
.pg p,.pg h3,.pg h4{margin-top:0}
.pg-head{flex:none}

.pg-body>:first-child{margin-top:0!important}
.lh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:11px;border-bottom:2px solid #A8864A}

.lh-id{display:flex;align-items:center;gap:14px;min-width:0}
.lh-logo{max-height:62px;max-width:130px;width:auto;height:auto;display:block}
.lh-name{font-size:23px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#0E1A2B;line-height:1.12}

.clh{text-align:center;padding-bottom:10px;border-bottom:1.6px solid #0E1A2B;margin-bottom:9mm}
.clh-name{font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0E1A2B;line-height:1.2}
.clh-sub{font-size:11.5px;color:#4B5563;margin-top:3px}
.pg-foot{flex:none;display:flex;justify-content:space-between;gap:16px;font-size:10px;letter-spacing:.04em;color:#7B8190;border-top:.8px solid #E2DBCD;padding-top:6px;margin-top:6mm;min-height:22px}
.pg-foot.plain{border-top-color:transparent}
.d-meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:16px}
.d-to{margin-bottom:14px;line-height:1.45}
.d-subj{margin-bottom:14px;line-height:1.45}
.d-p{margin-bottom:10px;text-align:justify}
.d-p.sal,.d-p.close,.d-p.attn,.d-p.refline,.d-p.cc,.d-p.pd{text-align:left}
.d-p.attn{margin:-6px 0 12px}
.d-p.refline{margin-bottom:12px}
.d-p.cc{font-size:12.5px;color:#374151;margin-top:14px}
.d-p.close{margin-top:4px}
.d-p.pd{margin-top:14px}
.d-h{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#0E1A2B;margin:14px 0 7px}
.d-list{margin-bottom:10px}
.d-li{display:flex;gap:8px;margin-bottom:5px;text-align:justify}
.d-n{flex:none;min-width:24px}
.d-list[data-style="bullet"] .d-n{min-width:14px}
.d-lt{flex:1;min-width:0}
.d-kv{margin:4px 0 14px;border-top:.8px solid #CFC6B4}
.d-kvr{display:flex;gap:14px;padding:5px 2px;border-bottom:.8px solid #E4DDCF;font-size:13.5px}
.d-kvr .k{flex:0 0 36%;color:#4B5160}
.d-kvr .v{flex:1}
.d-sign{margin-top:16px;line-height:1.45}
.d-close{margin-bottom:10px}
.d-sigspace{height:54px}
.d-pd{margin-top:10px}
.d-csign{margin-top:14px;line-height:1.45}
.d-csr{display:flex;gap:36px;margin-top:6px}
.d-cs{flex:1}
.d-sl{height:52px;border-bottom:.8px solid #1B1D22;margin-bottom:6px;max-width:220px}
.d-ack{margin-top:22px;padding-top:12px;border-top:.8px solid #CDC3AF}
.d-ackg{display:flex;flex-wrap:wrap;gap:16px 32px;margin-top:14px}

<script>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const has = v => Array.isArray(v) ? v.length > 0 : (v !== undefined && v !== null && v !== false && String(v).trim() !== '');

const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl';
function debounce(fn, ms) {
  let t, args;
  const d = (...a) => { args = a; clearTimeout(t); t = setTimeout(() => { t = null; fn(...args); }, ms); };
  d.flush = () => { if (t) { clearTimeout(t); t = null; fn(...(args || [])); } };
  d.pending = () => !!t;

<!-- =====================================================================
     3. STATE & PERSISTENCE
     ===================================================================== -->
<script>
const STORE_KEY = 'ca-auditdesk/v1';
const defaultState = () => ({ v: 1, firm: { tagline: 'Chartered Accountants', designation: 'Partner' }, clients: [], drafts: [], custom: [], seq: 0, ui: { collapsed: false }, exports: 0 });
let storageOK = true;
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw), d = defaultState();
      return { ...d, ...s, firm: { ...d.firm, ...(s.firm || {}) }, ui: { ...d.ui, ...(s.ui || {}) },
        clients: Array.isArray(s.clients) ? s.clients : [], drafts: Array.isArray(s.drafts) ? s.drafts : [], custom: Array.isArray(s.custom) ? s.custom : [] };
    }
  } catch (e) { storageOK = false; console.warn('AuditDesk: storage unavailable', e); }
  return defaultState();
}
let state = loadState();
let saveErrShown = false;
function persist() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    setSaveState('saved');
    return true;
  } catch (e) {
    setSaveState('error');
    if (!saveErrShown) { saveErrShown = true; toast('Browser storage is full or blocked. Export a backup from Firm profile to keep your work.', { type: 'error', title: 'Could not save', timeout: 8000 }); }
    return false;
  }
}
const persistSoon = debounce(persist, 400);
function markDirty() { setSaveState('saving'); persistSoon(); }
function setSaveState(s) {
  const el = $('#save-state'), dot = $('.save-dot');
  if (!el) return;
  dot && dot.classList.toggle('busy', s === 'saving');
  el.textContent = s === 'saving' ? 'Saving…' : s === 'error' ? 'Not saved' : 'Saved ' + (el.dataset.t = 'just now');
}
const getDraft = id => state.drafts.find(d => d.id === id);
const getClient = id => state.clients.find(c => c.id === id);
function nextRef() {
  state.seq = (state.seq || 0) + 1;
  const p = (state.firm.refPrefix || initials(state.firm.name) || 'AD').trim();
  return `${p}/${currentFY()}/${String(state.seq).padStart(3, '0')}`;
}
</script>

<script>
const VALIDATORS = {
  email: [/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/, 'Enter a valid email address'],
  frn:   [/^([0-9]{6}[WSNEC]|[WSNEC][0-9]{6})(\s*\/\s*([0-9]{6}[WSNEC]|[WSNEC][0-9]{6}))?$/i, 'FRN is 6 digits + region letter (e.g. 012345W) or LLP format (e.g. W100012)'],
  mno:   [/^\d{5,7}$/, 'Membership number should be 5–7 digits'],
  cin:   [/^([LU]\d{5}[A-Z]{2}\d{4}[A-Z]{3}\d{6}|[A-Z]{3}-\d{4})$/i, 'Enter a 21-character CIN or an LLPIN (e.g. AAB-1234)'],
  pan:   [/^[A-Z]{5}\d{4}[A-Z]$/i, 'PAN format: ABCDE1234F'],
  udin:  [/^\d{8}[A-Z0-9]{10}$/i, 'UDIN is 18 characters: YY + 6-digit membership no. + 10 characters'],
  gstin: [/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/i, 'Enter a valid 15-character GSTIN'],
  pin:   [/^\d{6}$/, 'PIN code is 6 digits'],
  phone: [/^[+\d][\d\s\-()]{6,}$/, 'Enter a valid phone number']
};
function fieldError(f, v) {
  if (f.req && !has(v)) return 'Required';
  const rule = VALIDATORS[f.v || (f.type === 'email' ? 'email' : '')];
  if (has(v) && rule && !rule[0].test(String(v).trim())) return rule[1];
  return '';
}
const FIRM_SECTIONS = [
  { id: 'identity', title: 'Identity', desc: 'How your firm appears at the head of every letter.', fields: [
    { key: 'name', label: 'Firm name', req: true, span: 'full', ph: 'e.g. Mehta Rao & Associates' },

<script>
function toast(msg, { type = 'success', title, action, timeout = 3800 } = {}) {
  const t = document.createElement('div');
  t.className = `toast t-${type}`;
  t.setAttribute('role', type === 'error' ? 'alert' : 'status');
  t.innerHTML = `<span class="t-ic">${ic(type === 'error' ? 'alert' : type === 'info' ? 'info' : 'check')}</span><div class="t-msg">${title ? `<strong>${esc(title)}</strong>` : ''}<span>${esc(msg)}</span></div>${action ? `<button class="t-act">${esc(action.label)}</button>` : ''}<button class="t-x" aria-label="Dismiss">${ic('x', 'sm')}</button>`;
  $('#toasts').append(t);
  let timer;
  const close = () => { clearTimeout(timer); t.classList.add('out'); setTimeout(() => t.remove(), 200); };
  const arm = () => { timer = setTimeout(close, timeout); };
  t.addEventListener('mouseenter', () => clearTimeout(timer));
  t.addEventListener('mouseleave', arm);
  t.querySelector('.t-x').onclick = close;
  if (action) t.querySelector('.t-act').onclick = () => { close(); action.fn(); };
  while ($('#toasts').children.length > 4) $('#toasts').firstElementChild.remove();
  arm();
}
const OV = [];
function overlay(html, { cls = '', onClose } = {}) {
  closeMenu();
  const prev = document.activeElement;
  const el = document.createElement('div');
  el.className = 'ov ' + cls;
  el.innerHTML = `<div class="ov-bg" data-ovclose></div>${html}`;
  $('#layer').append(el);
  requestAnimationFrame(() => el.classList.add('in'));
  const o = {
    el, closed: false,
    close(v) {
      if (o.closed) return; o.closed = true;
      OV.splice(OV.indexOf(o), 1);
      el.classList.remove('in');
      setTimeout(() => el.remove(), 220);
      onClose && onClose(v);

}
function focusables(root) { return $$('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])', root).filter(e => e.offsetParent !== null || e === document.activeElement); }
function openModal({ title, body = '', actions = [], size = '', onMount }) {

    o.el.addEventListener('click', e => { const b = e.target.closest('[data-val]'); if (b) o.close(actions[+b.dataset.val].value); });
    onMount && onMount(o.el, o);

  });
}
async function confirmDialog({ title, body, confirm = 'Confirm', danger = false, cancel = 'Cancel' }) {
  const v = await openModal({ title, body: `<p>${body}</p>`, actions: [{ label: cancel, value: false }, { label: confirm, kind: danger ? 'btn-danger' : 'btn-primary', value: true }] });
  return v === true;
}
function openDrawer({ title, sub = '', body, actions = [], onMount }) {
  return new Promise(res => {
    const o = overlay(`<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-t"><header class="m-head"><div style="flex:1"><h2 id="dr-t">${esc(title)}</h2>${sub ? `<div class="fhelp">${esc(sub)}</div>` : ''}</div><button class="icon-btn" data-ovclose aria-label="Close">${ic('x')}</button></header><div class="m-body">${body}</div><footer class="m-foot">${actions.map((a, i) => `<button class="btn ${a.kind || 'btn-ghost'}" data-dval="${i}">${a.label}</button>`).join('')}</footer></aside>`, { cls: 'side-ov', onClose: v => res(v) });
    o.el.addEventListener('click', e => { const b = e.target.closest('[data-dval]'); if (b) actions[+b.dataset.dval].fn(o); });

}
/* dropdown menus */
let MENU = null;
function openMenu(anchor, items, onPick) {

document.addEventListener('mousedown', e => { if (MENU && !MENU.el.contains(e.target) && !MENU.anchor.contains(e.target)) closeMenu(); });

/* tooltips (body-level, never clipped) */
const tipEl = () => $('#tip');
let tipTarget = null;
function showTip(el) {
  let text = el.dataset.tip;
  if (!text && el.dataset.navtip) {
    if (!(matchMedia('(min-width:901px)').matches && $('#app').dataset.collapsed === 'true')) return;

function hideTip() { tipTarget = null; tipEl().classList.remove('show'); }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip],[data-navtip]'); if (el && el !== tipTarget) showTip(el); else if (!el && tipTarget) hideTip(); });

document.addEventListener('focusout', hideTip);
document.addEventListener('scroll', hideTip, true);

/* ---- generic field renderer ---- */
const fid = k => 'f_' + String(k).replace(/[^\w]/g, '_');
function fieldHTML(f, val, err, ctx) {
  const id = fid(f.key);
  const full = f.span === 'full' || ['textarea', 'checks'].includes(f.type) || (f.type === 'seg' && normOpts(f.opts).length > 2);
  const help = f.help ? `<span class="hint" tabindex="0" role="note" data-tip="${esc(f.help)}" aria-label="${esc(f.help)}">?</span>` : '';
  const lab = `<label class="fl" for="${id}" id="${id}_l">${esc(f.label)}${f.req ? '<span class="req" aria-hidden="true">*</span>' : ''}${help}</label>`;
  const dk = `data-k="${esc(f.key)}"`;
  const inv = err ? ' aria-invalid="true"' : '';
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  let ctl = '';
  switch (f.type) {
    case 'textarea':
      ctl = `<textarea id="${id}" class="in" ${dk} rows="${f.rows || 3}"${ph}${inv}>${esc(val || '')}</textarea>`; break;
    case 'select':
      ctl = `<div class="sel"><select id="${id}" class="in" ${dk}${inv}>${!f.req || !has(val) ? '<option value="">—</option>' : ''}${normOpts(f.opts).map(o => `<option value="${esc(o.value)}"${o.value === val ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>${ic('chev-d', 'sm')}</div>`; break;
    case 'seg':
      ctl = `<div class="seg" role="radiogroup" aria-labelledby="${id}_l">${normOpts(f.opts).map(o => `<button type="button" role="radio" aria-checked="${o.value === val}" data-seg="${esc(f.key)}" data-v="${esc(o.value)}">${esc(o.label)}</button>`).join('')}</div>`; break;
    case 'toggle':

    case 'checks': {

    }

    case 'range':

function showFieldError(root, key, msg) {
  const fld = $(`.fld[data-fk="${CSS.escape(key)}"]`, root);

/* Two-way binding for any field container. api: { get(k), set(k, v, meta), field(k) } */

<!-- =====================================================================

<script>
const PV = {
  host: null, getDoc: null, zoom: 'fit', count: 0, onPh: null, _raf: 0, _t: 0,
  mount(host, getDoc, onPh) {
    this.host = host; this.getDoc = getDoc; this.onPh = onPh;
    host.innerHTML = `<div class="pv-bar"><div class="pv-info">${ic('file', 'sm')}<span><b id="pv-count">—</b> · A4</span></div><span class="pv-legend" data-tip="Highlighted items are still blank — click one to jump to its field."><i></i>To fill</span>
      <div class="pv-zoom" role="group" aria-label="Zoom"><button data-zoom="out" aria-label="Zoom out">${ic('zout', 'sm')}</button><button data-zoom="fit" id="pv-zl" aria-pressed="true" data-tip="Fit to width">Fit</button><button data-zoom="in" aria-label="Zoom in">${ic('zin', 'sm')}</button></div></div>
      <div class="pv-pages" id="pv-pages"><div class="pv-skel" aria-label="Loading preview">${'<i style="width:40%"></i><i></i><i style="width:85%"></i><i></i><i style="width:70%"></i><i style="width:92%"></i><i style="width:60%"></i>'}</div></div>`;
    host.addEventListener('click', e => {
      const ph = e.target.closest('.ph'); if (ph && this.onPh) { this.onPh(ph.dataset.ph); return; }
      const z = e.target.closest('[data-zoom]'); if (z) this.setZoom(z.dataset.zoom);
    });
    if (this.ro) this.ro.disconnect();
    this.ro = new ResizeObserver(() => this.fit());
    this.ro.observe(host);
  },
  schedule() { clearTimeout(this._t); this._t = setTimeout(() => { cancelAnimationFrame(this._raf); this._raf = requestAnimationFrame(() => this.render()); }, 110); },
  render() {
    if (!this.host || !this.host.isConnected) return;
    const wrap = $('#pv-pages', this.host);
    const pages = paginateDoc({ ...this.getDoc(), mode: 'preview' });
    const st = this.host.scrollTop;
    wrap.innerHTML = '';
    pages.forEach((pg, i) => {
      const f = document.createElement('div'); f.className = 'pv-frame'; f.dataset.n = pages.length > 1 ? `${i + 1} / ${pages.length}` : '';
      const s = document.createElement('div'); s.className = 'pv-scale';
      s.append(pg.cloneNode(true)); f.append(s); wrap.append(f);
    });
    this.count = pages.length;
    this.pw = pages[0] ? pages[0].offsetWidth : 794; this.ph = pages[0] ? pages[0].offsetHeight : 1123;
    const c = $('#pv-count', this.host); if (c) c.textContent = `${pages.length} page${pages.length > 1 ? 's' : ''}`;
    const tab = $('#tab-pv-n'); if (tab) tab.textContent = pages.length;
    this.fit();
    this.host.scrollTop = st;
  },
  scale() {
    const wrap = this.host && $('#pv-pages', this.host);
    if (!wrap) return 1;
    if (this.zoom !== 'fit') return this.zoom;
    const w = wrap.clientWidth - 48;
    return Math.max(0.3, Math.min(1.2, w / (this.pw || 794)));
  },
  fit() {
    if (!this.host) return;
    const s = this.scale();
    $$('.pv-frame', this.host).forEach(f => { f.style.width = (this.pw || 794) * s + 'px'; f.style.height = (this.ph || 1123) * s + 'px'; f.firstChild.style.transform = `scale(${s})`; });
    const zl = $('#pv-zl', this.host);
    if (zl) { zl.textContent = this.zoom === 'fit' ? 'Fit' : Math.round(s * 100) + '%'; zl.setAttribute('aria-pressed', String(this.zoom === 'fit')); }
  },
  setZoom(z) {
    const cur = this.scale();
    if (z === 'fit') this.zoom = 'fit';
    else if (z === 'in') this.zoom = Math.min(2, Math.round((cur + 0.1) * 10) / 10);
    else if (z === 'out') this.zoom = Math.max(0.3, Math.round((cur - 0.1) * 10) / 10);
    this.fit();
  },
  detach() { if (this.ro) this.ro.disconnect(); this.host = null; }
};
</script>

<script>

const catOf = t => CATS[t.cat] || CATS.custom;

function draftTitle(d, tpl) { tpl = tpl || getTpl(d.tplId); return d.title || `${tpl ? tpl.short : 'Document'}${clientOfDraft(d) ? ' — ' + clientOfDraft(d) : ''}`; }
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function firstName() { const p = String(state.firm.partner || '').replace(/^CA\.?\s+/i, '').trim(); return p.split(/\s+/)[0] || ''; }
function firmSetup() {
  const f = state.firm;
  const items = [
    { t: 'Firm name & FRN', ok: has(f.name) && has(f.frn), k: 'name' },
    { t: 'Office address & contact', ok: has(f.address) && has(f.email) && has(f.phone), k: 'address' },

function draftRow(d) {

    <span class="row-act"><button class="icon-btn" data-act="dup-draft" data-id="${d.id}" data-tip="Duplicate" aria-label="Duplicate">${ic('copy', 'sm')}</button><button class="icon-btn danger" data-act="del-draft" data-id="${d.id}" data-tip="Delete" aria-label="Delete">${ic('trash', 'sm')}</button></span>
  </div>`;
}

}

/* ---------- Dashboard ---------- */
function viewDashboard() {
  const setup = firmSetup();
  const drafts = [...state.drafts].sort((a, b) => b.updatedAt - a.updatedAt);
  const month = new Date(); month.setDate(1); month.setHours(0, 0, 0, 0);
  const thisMonth = drafts.filter(d => d.createdAt >= +month).length;

function readLogo(file) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('Please choose an image file (PNG, JPG, SVG or WebP).'));
    if (file.size > 4 * 1024 * 1024) return rej(new Error('That image is larger than 4 MB. Please use a smaller file.'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('The file could not be read.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('The image could not be decoded.'));
      im.onload = () => {
        const w0 = im.naturalWidth || 480, h0 = im.naturalHeight || 240;
        const s = Math.min(1, 520 / w0, 260 / h0);
        const cv = document.createElement('canvas'); cv.width = Math.round(w0 * s) || 1; cv.height = Math.round(h0 * s) || 1;
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/png'));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function restoreBackup(file) {
  const fr = new FileReader();
  fr.onload = async () => {
    let data;
    try { data = JSON.parse(fr.result); } catch (e) { toast('That file is not valid JSON.', { type: 'error', title: 'Restore failed' }); return; }
    if (!data || typeof data !== 'object' || !data.firm || !Array.isArray(data.drafts)) { toast('This does not look like an AuditDesk backup.', { type: 'error', title: 'Restore failed' }); return; }
    const ok = await confirmDialog({ title: 'Restore this backup?', body: `It contains ${data.drafts.length} document(s) and ${(data.clients || []).length} client(s), and will replace everything currently in this browser.`, confirm: 'Replace & restore', danger: true });
    if (!ok) return;
    const d = defaultState();
    state = { ...d, ...data, firm: { ...d.firm, ...data.firm }, clients: data.clients || [], custom: data.custom || [], ui: { ...d.ui, ...(data.ui || {}) } };
    persist(); updateChrome(); route();
    toast('Your data has been restored.', { title: 'Backup restored' });
  };
  fr.readAsText(file);
}

function openPicker(presetClient) {

    title: 'New document', size: 'lg',
    body: `<div class="grid2" style="grid-template-columns:1.4fr 1fr;align-items:end"><label class="searchbox" style="height:42px">${ic('search')}<input id="pk-q" autofocus placeholder="Find a template…" aria-label="Find a template" aria-controls="pk-list"></label>

<script>

    rerenderList();
  },
  'del-draft': async el => {

  },

    ...(EMBEDDED ? [] : [{ id: 'print', text: 'Print', icon: 'printer' }]),

  },
  'compose-new': () => { const c = newCustom(); state.custom.unshift(c); persist(); go('#/compose/' + c.id); },
  'compose-dup': el => { const c = state.custom.find(x => x.id === el.dataset.id); if (!c) return; const n = { ...clone(c), id: uid('t'), title: c.title + ' (copy)', createdAt: Date.now(), updatedAt: Date.now() }; state.custom.unshift(n); persist(); go('#/compose/' + n.id); toast('Template duplicated.', { title: 'Copy created' }); },
  'compose-del': async el => {
    const c = state.custom.find(x => x.id === el.dataset.id); if (!c) return;
    const used = state.drafts.filter(d => d.tplId === 'c:' + c.id).length;
    const ok = await confirmDialog({ title: 'Delete this template?', body: `“${esc(c.title)}” will be removed from your library.${used ? ` ${used} document(s) created from it will no longer open.` : ''}`, confirm: 'Delete template', danger: true });
    if (!ok) return;
    state.custom = state.custom.filter(x => x !== c); persist();
    toast('Template deleted.', { title: 'Deleted' });
    location.hash.startsWith('#/compose/') ? go('#/compose') : route();
  },
  'custom-menu': el => openMenu(el, [{ id: 'edit', text: 'Edit in Composer', icon: 'pen' }, { id: 'dup', text: 'Duplicate', icon: 'copy' }, '-', { id: 'del', text: 'Delete', icon: 'trash', danger: true }], id => {
    if (id === 'edit') go('#/compose/' + el.dataset.id);
    if (id === 'dup') ACT['compose-dup'](el);
    if (id === 'del') ACT['compose-del'](el);
  })
};
function rerenderList() { const r = $('.vroot'); if (r && r._redraw) r._redraw(); else if (!location.hash.startsWith('#/doc/')) route(); }
document.addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open && !e.target.closest('[data-act]')) { go('#/doc/' + open.dataset.open); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const fn = ACT[a.dataset.act];
  if (!fn) return;
  if (a.tagName === 'A' && a.getAttribute('href') && a.dataset.act !== 'new-doc') { /* allow navigation + action */ }
  else e.preventDefault();
  fn(a, e);
});
document.addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input,textarea,select,[contenteditable]');
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') {
    if (MENU) { const a = MENU.anchor; closeMenu(); a.focus(); e.preventDefault(); return; }
    if (OV.length) { OV[OV.length - 1].close(); e.preventDefault(); return; }
    if ($('#app').classList.contains('nav-open')) { ACT['close-nav'](); return; }
  }
  if (e.key === 'Tab' && OV.length) {
    const f = focusables(OV[OV.length - 1].el); if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && !typing && e.target.matches('.row[data-open],.row[data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); persistSoon.flush(); if (persist()) toast('All changes are saved in this browser.', { title: 'Saved', timeout: 2000 }); return; }
  const inEditor = location.hash.startsWith('#/doc/') && ED.draft;
  if (mod && e.key.toLowerCase() === 'p' && inEditor && !OV.length && !EMBEDDED) { e.preventDefault(); edExport('print', $('[data-kind="print"]')); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'e' && inEditor && !OV.length) { e.preventDefault(); edExport('pdf', $('[data-kind="pdf"]')); return; }
  if (typing || mod || e.altKey || OV.length) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openPicker(); }
  else if (e.key === '/') { const s = $('#lib-q,#doc-q,#cl-q'); e.preventDefault(); s ? s.focus() : openPalette(); }
  else if (e.key === '?') { e.preventDefault(); showShortcuts(); }
});

function applyCollapse() {
  const c = !!state.ui.collapsed;
  $('#app').dataset.collapsed = String(c);
  const b = $('.collapse-btn'); b.setAttribute('aria-label', c ? 'Expand sidebar' : 'Collapse sidebar'); $('.lbl', b).textContent = c ? 'Expand' : 'Collapse';
}
function updateChrome() {
  const f = state.firm;
  $('#firm-chip').innerHTML = `<span class="firm-av">${has(f.logo) ? `<img src="${esc(f.logo)}" alt="">` : esc(initials(f.name, 2) || 'CA')}</span><span class="firm-meta"><b>${esc(f.name || 'Set up your firm')}</b><small>${has(f.frn) ? 'FRN ' + esc(f.frn) : 'Add FRN & letterhead'}</small></span>`;
  $('#firm-chip').dataset.navtip = f.name || 'Firm profile';
  $('#nd-firm').hidden = firmReady();
  $('#nc-docs').textContent = state.drafts.length || '';
  $('#nc-clients').textContent = state.clients.length || '';
}
function defaultTopbar(v) {
  return `<button class="icon-btn only-mobile" data-act="open-nav" aria-label="Open navigation">${ic('menu')}</button>
    <div class="tb-title"><div class="tb-eyebrow">${esc(v.eyebrow || '')}</div><h1>${esc(v.title)}</h1></div>
    <div class="tb-spacer"></div>
    <button class="search-trigger" data-act="palette" aria-label="Search and commands (${MOD}+K)">${ic('search', 'sm')}<span>Search or jump to…</span><kbd>${MOD} K</kbd></button>
    <button class="btn btn-primary tb-new" data-act="new-doc">${ic('plus')}<span class="bl">New document</span></button>`;
}
const ROUTES = [
  [/^#?\/?$/, () => viewDashboard()],
  [/^#\/documents$/, () => viewDocuments()],
  [/^#\/templates$/, () => viewLibrary()],
  [/^#\/doc\/([\w-]+)$/, m => viewEditor(m[1])],
  [/^#\/compose$/, () => viewComposeList()],
  [/^#\/compose\/([\w-]+)$/, m => viewComposer(m[1])],
  [/^#\/clients$/, () => viewClients()],
  [/^#\/firm$/, () => viewFirm()]
];
function route() {
  persistSoon.flush();
  closeMenu(); hideTip();
  while (OV.length) OV[OV.length - 1].close();
  PV.detach(); ED.draft = null;
  const h = location.hash || '#/';
  let v = null;
  for (const [re, fn] of ROUTES) { const m = h.match(re); if (m) { v = fn(m); break; } }
  if (!v) v = viewMissing('Page not found', 'That address does not exist in AuditDesk.');
  const tb = $('#topbar');
  tb.innerHTML = v.topbar || defaultTopbar(v);
  tb.classList.toggle('ruled', !!v.ruled);
  const view = $('#view');
  view.className = 'view' + (v.full ? ' full' : '');
  view.innerHTML = `<div class="vroot">${v.html}</div>`;
  $$('#nav a').forEach(a => { if (a.dataset.route === v.nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.title = `${v.title} · CA AuditDesk`;
  $('#app').classList.remove('nav-open');
  window.scrollTo(0, 0);
  if (v.mount) v.mount($('.vroot', view));
  updateChrome();
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', scrollY > 4), { passive: true });
window.addEventListener('beforeunload', () => persistSoon.flush());
document.addEventListener('visibilitychange', () => { if (document.hidden) persistSoon.flush(); });
setInterval(() => { const el = $('#save-state'); if (el && el.textContent.startsWith('Saved')) { const d = ED.draft; if (d) el.textContent = 'Saved ' + relTime(d.updatedAt); } }, 30000);

/* boot */
applyCollapse();
route();
if (!storageOK) toast('Changes will not persist after you close this tab.', { type: 'error', title: 'Browser storage unavailable', timeout: 8000 });
if (document.fonts) {
  Promise.all(['400 15px Tinos', '700 15px Tinos', 'italic 400 15px Tinos'].map(f => document.fonts.load(f).catch(() => {}))).then(() => fontsReady()).then(() => { if (PV.host) PV.render(); });
}
</script>
</body>
</html>
